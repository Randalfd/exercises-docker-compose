services:
  frontend:
    build:
      context: ..
      dockerfile: 2_03-10/frontend/Dockerfile.frontend
  backend:
    build:
      context: ..
      dockerfile: 2_03-10/backend/Dockerfile.backend
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: psql_db
      POSTGRES_USER: randalfd
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: psql_db_docker
    depends_on:
      - psql_db
  redis:
    image: redis:8.12-rc3-alpine3.23
  db:
    image: postgres:18.7-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: randalfd
      POSTGRES_DB: psql_db_docker
    volumes:
      - ./data:/var/lib/postgresql
    security_opt:
      - label=disable
  nginx:
    image: nginx
    ports:
      - 8000:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    security_opt:
      - label=disable
    depends_on:
      - frontend
      - backend
